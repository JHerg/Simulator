<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sportgames 2026</title>
<style>
  :root{
    --bg:#070b14;
    --ink:#f2f6fb;
    --muted:#93a4bd;
    --gold:#ffd75e;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
    min-height:100svh;
    display:flex;align-items:center;justify-content:center;
    padding:32px 20px;
    overflow-x:hidden;
    position:relative;
  }

  /* ── Bewegter Farbschleier im Hintergrund ───────────────────── */
  .aurora{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
  .blob{
    position:absolute;border-radius:50%;filter:blur(95px);opacity:.42;
    animation:drift 22s ease-in-out infinite;
  }
  .b1{width:52vw;height:52vw;background:#1b6bff;top:-14%;left:-12%;}
  .b2{width:46vw;height:46vw;background:#ff8a1e;bottom:-16%;right:-10%;animation-delay:-7s;}
  .b3{width:38vw;height:38vw;background:#00d0a4;top:34%;right:26%;animation-delay:-13s;}
  @keyframes drift{
    0%,100%{transform:translate(0,0) scale(1);}
    33%    {transform:translate(5vw,-4vh) scale(1.12);}
    66%    {transform:translate(-4vw,5vh) scale(.92);}
  }
  /* feines Raster darüber – gibt dem Ganzen Halt */
  .grid{
    position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.18;
    background-image:linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(ellipse 80% 65% at 50% 45%,#000 30%,transparent 78%);
    -webkit-mask-image:radial-gradient(ellipse 80% 65% at 50% 45%,#000 30%,transparent 78%);
  }

  /* ── Inhalt ─────────────────────────────────────────────────── */
  main{position:relative;z-index:2;text-align:center;max-width:900px;width:100%;}

  .kicker{
    display:inline-flex;align-items:center;gap:10px;
    padding:8px 18px;border-radius:999px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    color:#cddcf0;margin-bottom:28px;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#39e08f;
       box-shadow:0 0 12px #39e08f;animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.45;transform:scale(.8);}}

  /* Begrüßung bleibt ruhig, der Event-Name trägt die Seite */
  .greet{
    display:block;
    font-size:clamp(17px,3vw,27px);
    font-weight:600;color:#c3d3e8;letter-spacing:.01em;
    margin-bottom:6px;
  }
  h1{
    font-size:clamp(38px,9vw,92px);
    font-weight:800;line-height:1.05;letter-spacing:-.025em;
    margin-bottom:22px;text-wrap:balance;
  }
  h1 .shine{
    background:linear-gradient(100deg,#ffd75e 0%,#ff9a3c 42%,#ffd75e 100%);
    background-size:220% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:sweep 6s linear infinite;
  }
  @keyframes sweep{to{background-position:220% center;}}

  .lead{
    font-size:clamp(15px,2.1vw,19px);line-height:1.65;color:var(--muted);
    max-width:560px;margin:0 auto 38px;text-wrap:pretty;
  }

  /* Disziplinen */
  .sports{
    display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:40px;
  }
  .sport{
    display:flex;align-items:center;gap:9px;
    padding:11px 18px;border-radius:14px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.12);
    font-size:14.5px;font-weight:600;color:#dce7f5;
    transition:transform .18s ease,background .18s ease,border-color .18s ease;
  }
  .sport:hover{transform:translateY(-3px);background:rgba(255,255,255,.1);
               border-color:rgba(255,255,255,.28);}
  .sport span{font-size:19px;line-height:1;}

  .cta{
    display:inline-block;padding:17px 52px;border:none;border-radius:15px;
    font-size:18px;font-weight:700;font-family:inherit;color:#0a1020;cursor:pointer;
    background:linear-gradient(135deg,#ffd75e,#ff9a3c);
    box-shadow:0 8px 30px rgba(255,150,40,.34);
    transition:transform .16s ease,box-shadow .16s ease;
  }
  .cta:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(255,160,50,.5);}
  .cta:active{transform:translateY(-1px);}

  .note{margin-top:20px;font-size:13.5px;color:#66788f;}

  @media (prefers-reduced-motion:reduce){
    .blob,.dot,h1 .shine{animation:none;}
  }
</style>
</head>
<body>

<div class="aurora">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>
<div class="grid"></div>

<main>
  <div class="kicker"><span class="dot"></span> Saison 2026</div>

  <h1>
    <span class="greet">Herzlich willkommen bei den</span>
    <span class="shine">Sportgames 2026</span>
  </h1>

  <p class="lead">
    Die große Spielesammlung rund um Sport und Wettkampf.
    Tritt an, sammle Medaillen und hol dir den Titel.
  </p>

  <div class="sports">
    <div class="sport"><span>🏃</span> Leichtathletik</div>
    <div class="sport"><span>🏊</span> Schwimmen</div>
    <div class="sport"><span>🚴</span> Radsport</div>
    <div class="sport"><span>🎯</span> Zielwerfen</div>
    <div class="sport"><span>⛷️</span> Ski</div>
    <div class="sport"><span>🏋️</span> Gewichtheben</div>
  </div>

  <button class="cta" id="start">🏅 Spiele starten</button>
  <p class="note">Die Disziplinen kommen als Nächstes.</p>
</main>

<script>
  document.getElementById('start').addEventListener('click', () => {
    const n = document.querySelector('.note');
    n.textContent = '🚧 Noch in Arbeit — die erste Disziplin folgt!';
    n.style.color = '#ffc25e';
  });
</script>

</body>
</html>
