<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fahrsimulator</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b1016;
            font-family:'Segoe UI',system-ui,Arial,sans-serif;}
  canvas{display:block;width:100vw;height:100vh;}

  /* ── Startmenü ─────────────────────────────────────── */
  #menu{
    position:fixed;inset:0;z-index:100;
    background:linear-gradient(160deg,#0d1a26,#050a10);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
    color:#dfe9f2;text-align:center;padding:20px;
  }
  #menu h1{font-size:34px;font-weight:700;letter-spacing:.04em;}
  #menu p{font-size:15px;color:#7f95a8;max-width:420px;line-height:1.6;}
  #btn-start{
    padding:16px 52px;border:none;border-radius:14px;cursor:pointer;
    font-size:19px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,#0044cc,#0090ff);
    box-shadow:0 5px 24px rgba(0,110,255,.45);
    transition:transform .15s,box-shadow .15s;
  }
  #btn-start:hover{transform:translateY(-2px);box-shadow:0 9px 30px rgba(0,140,255,.6);}
  #keys{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .key{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
       border-radius:8px;padding:7px 13px;font-size:13px;color:#9fb3c6;}
  .key b{color:#fff;}

  /* ── Ladehinweis ───────────────────────────────────── */
  #boot{position:fixed;inset:0;z-index:200;background:#050a10;color:#4d9fd6;
        display:flex;align-items:center;justify-content:center;font-size:15px;}

  /* ── HUD ───────────────────────────────────────────── */
  #speedo{
    position:fixed;right:22px;bottom:22px;z-index:40;pointer-events:none;
    background:rgba(0,0,0,.6);border-radius:14px;padding:10px 20px;
    text-align:center;color:#fff;min-width:112px;
  }
  #spd{font-size:38px;font-weight:700;line-height:1;}
  #unit{font-size:11px;color:#8ba2b5;letter-spacing:.16em;margin-top:2px;}
  #gear{font-size:15px;color:#ffcc55;font-weight:700;margin-top:5px;}

  /* ── Touch-Steuerung (nur auf Touch-Geräten) ───────── */
  #touch{display:none;}
  .tbtn{
    position:fixed;z-index:45;border-radius:14px;
    background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);
    color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;touch-action:none;
  }
  .tbtn.on{background:rgba(255,255,255,.32);}
  @media(pointer:coarse){
    #touch{display:block;}
    #speedo{bottom:auto;top:16px;right:16px;padding:7px 14px;min-width:88px;}
    #spd{font-size:26px;}
  }
  #t-l{left:14px;bottom:20px;width:72px;height:72px;}
  #t-r{left:96px;bottom:20px;width:72px;height:72px;}
  #t-g{right:14px;bottom:20px;width:92px;height:72px;background:rgba(0,150,60,.4);}
  #t-b{right:118px;bottom:20px;width:72px;height:72px;background:rgba(170,30,30,.4);}
</style>
</head>
<body>

<div id="boot">Lade Fahrsimulator…</div>

<div id="menu" style="display:none">
  <h1>🚗 Fahrsimulator</h1>
  <p>Freies Fahren auf einem offenen Straßennetz mit Ampeln und Verkehr.</p>
  <button id="btn-start">🕹 Freie Fahrt</button>
  <div id="keys">
    <div class="key"><b>W</b> Gas</div>
    <div class="key"><b>S</b> Bremse / Rückwärts</div>
    <div class="key"><b>A</b> Links</div>
    <div class="key"><b>D</b> Rechts</div>
    <div class="key"><b>Leertaste</b> Handbremse</div>
    <div class="key"><b>R</b> Zurücksetzen</div>
  </div>
</div>

<canvas id="canvas"></canvas>

<div id="speedo">
  <div id="spd">0</div>
  <div id="unit">KM/H</div>
  <div id="gear">N</div>
</div>

<div id="touch">
  <div class="tbtn" id="t-l">◀</div>
  <div class="tbtn" id="t-r">▶</div>
  <div class="tbtn" id="t-g">GAS</div>
  <div class="tbtn" id="t-b">⛔</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

document.getElementById('boot').style.display = 'none';
document.getElementById('menu').style.display = 'flex';
document.getElementById('btn-start').addEventListener('click', () => {
  document.getElementById('menu').style.display = 'none';
  start();
});

function start() {

// ══════════════════════════════════════════════════════════════════════════
//  Grundgerüst
// ══════════════════════════════════════════════════════════════════════════
const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth < 700;
const lowPerf  = /Android/i.test(navigator.userAgent);

const canvas   = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile });
renderer.setPixelRatio(Math.min(devicePixelRatio, lowPerf ? 1.0 : isMobile ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fc4e8);
scene.fog = new THREE.Fog(0x8fc4e8, 260, lowPerf ? 900 : 1700);

// near/far eng halten → deutlich bessere Tiefenpuffer-Auflösung (kein Z-Fighting
// zwischen Boden und Fahrbahn). far liegt knapp hinter dem Nebelende.
const cam = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.2, 1900);
scene.add(cam);

scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x4a5a44, 1.15));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.5);
sun.position.set(320, 480, 180);
scene.add(sun);

addEventListener('resize', () => {
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ══════════════════════════════════════════════════════════════════════════
//  Straßennetz (namenlos): 3 lange Nord-Süd-Straßen × 7 Querstraßen
// ══════════════════════════════════════════════════════════════════════════
const XS = [-320, 0, 320];                                       // Nord-Süd-Straßen
const ZS = Array.from({ length: 9 }, (_, i) => i * 260);         // Querstraßen alle 260 m
const ROAD_W  = 14;            // Fahrbahnbreite
const HALF_W  = ROAD_W / 2;
const LANE    = 3.5;           // Spurversatz von der Mittellinie
const Z_MIN = ZS[0] - 220,             Z_MAX = ZS[ZS.length - 1] + 220;
const X_MIN = XS[0] - 320,             X_MAX = XS[XS.length - 1] + 320;

// Untergrund. polygonOffset drückt ihn im Tiefenpuffer nach hinten, damit die
// Fahrbahn bei flachem Blickwinkel garantiert obenauf liegt.
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(5000, 5000),
  new THREE.MeshLambertMaterial({
    color: 0x5c7050,
    polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 4,
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, 0, (Z_MIN + Z_MAX) / 2);
scene.add(ground);

const asphalt = new THREE.MeshLambertMaterial({ color: 0x35383c });

// Nord-Süd-Fahrbahnen
XS.forEach(x => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, Z_MAX - Z_MIN), asphalt);
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, 0.06, (Z_MIN + Z_MAX) / 2);
  scene.add(m);
});
// Ost-West-Fahrbahnen (minimal höher → keine Überlappung an den Kreuzungen)
ZS.forEach(z => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(X_MAX - X_MIN, ROAD_W), asphalt);
  m.rotation.x = -Math.PI / 2;
  m.position.set((X_MIN + X_MAX) / 2, 0.07, z);
  scene.add(m);
});

// ── Mittellinien-Striche (ein einziger InstancedMesh für alles) ──────────────
(function buildLaneDashes() {
  const DASH_L = 4, GAP = 8, STEP = DASH_L + GAP;
  const spots = [];

  XS.forEach(x => {
    for (let z = Z_MIN + STEP; z < Z_MAX; z += STEP)
      if (!ZS.some(cz => Math.abs(z - cz) < HALF_W + 6)) spots.push({ x, z, rot: 0 });
  });
  ZS.forEach(z => {
    for (let x = X_MIN + STEP; x < X_MAX; x += STEP)
      if (!XS.some(cx => Math.abs(x - cx) < HALF_W + 6)) spots.push({ x, z, rot: Math.PI / 2 });
  });

  const geo = new THREE.PlaneGeometry(0.34, DASH_L);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xe8e4d8,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4,
  });
  const inst = new THREE.InstancedMesh(geo, mat, spots.length);
  const dummy = new THREE.Object3D();
  spots.forEach((s, i) => {
    dummy.position.set(s.x, 0.14, s.z);
    dummy.rotation.set(-Math.PI / 2, 0, s.rot);
    dummy.updateMatrix();
    inst.setMatrixAt(i, dummy.matrix);
  });
  inst.instanceMatrix.needsUpdate = true;
  scene.add(inst);
})();

// ══════════════════════════════════════════════════════════════════════════
//  Ampeln – an jeder Kreuzung vier Stück, je Zufahrt eine
// ══════════════════════════════════════════════════════════════════════════
const RED = 0, YEL = 1, GRN = 2;
const bulbOn  = [0xff2a17, 0xffb300, 0x28d94a].map(c => new THREE.MeshBasicMaterial({ color: c }));
const bulbOff = new THREE.MeshBasicMaterial({ color: 0x14171a });

const poleGeo = new THREE.CylinderGeometry(0.09, 0.11, 5.2, 6);
const caseGeo = new THREE.BoxGeometry(0.46, 1.5, 0.3);
const lensGeo = new THREE.CircleGeometry(0.14, 10);
const darkMat = new THREE.MeshLambertMaterial({ color: 0x1c1f22 });

const grid = [];            // grid[xi][zi] → gemeinsames Kreuzungsobjekt
const signals = [];         // { bulbs[3], axisNS, inter, last }

function makeSignal(x, z, faceY, inter, axisNS) {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(poleGeo, darkMat);
  pole.position.y = 2.6; g.add(pole);
  const box = new THREE.Mesh(caseGeo, darkMat);
  box.position.y = 5.3; g.add(box);

  const bulbs = [0.52, 0, -0.52].map(yo => {
    const b = new THREE.Mesh(lensGeo, bulbOff);
    b.position.set(0, 5.3 + yo, 0.16);
    g.add(b);
    return b;
  });

  g.position.set(x, 0, z);
  g.rotation.y = faceY;
  scene.add(g);
  signals.push({ bulbs, axisNS, inter, last: -1 });
}

XS.forEach((x, xi) => {
  grid[xi] = [];
  ZS.forEach((z, zi) => {
    const inter = { xi, zi, x, z, phase: Math.random() * 28 };
    grid[xi][zi] = inter;
    const O = HALF_W + 2;   // seitlicher Versatz an den Fahrbahnrand
    const B = HALF_W + 3;   // Abstand vor der Kreuzung
    makeSignal(x + O, z - B,  Math.PI,      inter, true);   // für Fahrt Richtung +z
    makeSignal(x - O, z + B,  0,            inter, true);   // für Fahrt Richtung −z
    makeSignal(x - B, z - O, -Math.PI / 2,  inter, false);  // für Fahrt Richtung +x
    makeSignal(x + B, z + O,  Math.PI / 2,  inter, false);  // für Fahrt Richtung −x
  });
});

// 28-Sekunden-Zyklus: NS 12 s grün, 2 s gelb → EW 12 s grün, 2 s gelb
function phaseState(inter, axisNS, t) {
  const c = (t + inter.phase) % 28;
  if (c < 12) return axisNS ? GRN : RED;
  if (c < 14) return axisNS ? YEL : RED;
  if (c < 26) return axisNS ? RED : GRN;
  return axisNS ? RED : YEL;
}

function updateSignals(t) {
  for (const s of signals) {
    const st = phaseState(s.inter, s.axisNS, t);
    if (st === s.last) continue;      // Material nur bei Wechsel tauschen
    s.last = st;
    s.bulbs[0].material = st === RED ? bulbOn[0] : bulbOff;
    s.bulbs[1].material = st === YEL ? bulbOn[1] : bulbOff;
    s.bulbs[2].material = st === GRN ? bulbOn[2] : bulbOff;
  }
}

// ══════════════════════════════════════════════════════════════════════════
//  Verkehr – NPCs fahren das Raster entlang und halten bei Rot
// ══════════════════════════════════════════════════════════════════════════
// Start auf der langen Mittelachse, rund 130 m vor der nächsten Ampelkreuzung
const START_X = XS[1] + LANE, START_Z = ZS[1] - 130;
const car = { x: START_X, z: START_Z, heading: 0, speed: 0, steer: 0, vx: 0, vz: 0 };

const nodeAt = (xi, zi) => grid[xi][zi];
function neighbours(xi, zi) {
  const n = [];
  if (xi > 0)             n.push([xi - 1, zi]);
  if (xi < XS.length - 1) n.push([xi + 1, zi]);
  if (zi > 0)             n.push([xi, zi - 1]);
  if (zi < ZS.length - 1) n.push([xi, zi + 1]);
  return n;
}

const NPC_COLORS = [0xcc3333, 0x2255bb, 0xdddddd, 0x333333, 0x228855, 0xddaa22, 0x884499, 0x22aabb];

function buildCarMesh(color) {
  const g = new THREE.Group();
  const paint = new THREE.MeshStandardMaterial({ color, metalness: 0.32, roughness: 0.42 });
  const blk   = new THREE.MeshStandardMaterial({ color: 0x0b0b0d, roughness: 0.7, metalness: 0.2 });
  const gls   = new THREE.MeshStandardMaterial({ color: 0x13212e, roughness: 0.12, metalness: 0.1,
                                                 transparent: true, opacity: 0.8 });
  const sill = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.42, 4.0), blk);
  sill.position.y = 0.42; g.add(sill);
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.82, 0.6, 3.9), paint);
  body.position.y = 0.82; g.add(body);
  const hood = new THREE.Mesh(new THREE.BoxGeometry(1.74, 0.3, 1.1), paint);
  hood.position.set(0, 1.0, 1.35); g.add(hood);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 2.0), paint);
  roof.position.set(0, 1.44, -0.35); g.add(roof);
  const ws = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.62), gls);
  ws.position.set(0, 1.49, 0.72); ws.rotation.x = -0.42; g.add(ws);
  const rw = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.55), gls);
  rw.position.set(0, 1.49, -1.4); rw.rotation.set(0.42, Math.PI, 0); g.add(rw);
  [-1, 1].forEach(sx => {
    const sw = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 0.5), gls);
    sw.position.set(sx * 0.81, 1.49, -0.35);
    sw.rotation.y = sx * Math.PI / 2; g.add(sw);
  });
  [-0.6, 0.6].forEach(hx => {
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.18, 0.08),
      new THREE.MeshBasicMaterial({ color: 0xfff6cc }));
    hl.position.set(hx, 0.78, 1.97); g.add(hl);
    const tl = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.18, 0.08),
      new THREE.MeshBasicMaterial({ color: 0xcc1111 }));
    tl.position.set(hx, 0.85, -1.97); g.add(tl);
  });
  [[-0.9, 1.25], [0.9, 1.25], [-0.9, -1.25], [0.9, -1.25]].forEach(([rx, rz]) => {
    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.24, 12), blk);
    w.rotation.z = Math.PI / 2; w.position.set(rx, 0.34, rz); g.add(w);
  });
  return g;
}

const npcs = [];
function spawnNPC(color) {
  const xi = Math.floor(Math.random() * XS.length);
  const zi = Math.floor(Math.random() * ZS.length);
  const from = nodeAt(xi, zi);
  const opts = neighbours(xi, zi);
  const [nxi, nzi] = opts[Math.floor(Math.random() * opts.length)];
  const to = nodeAt(nxi, nzi);
  const mesh = buildCarMesh(color);
  scene.add(mesh);
  const heading = Math.atan2(to.x - from.x, to.z - from.z);
  const r = laneRight(heading);
  // Irgendwo auf der Strecke starten (nicht alle auf den Kreuzungen)
  const f = 0.1 + Math.random() * 0.75;
  const npc = {
    mesh, from, to, heading,
    x: from.x + (to.x - from.x) * f + r.x * LANE,
    z: from.z + (to.z - from.z) * f + r.z * LANE,
    speed: 8 + Math.random() * 4, maxSpeed: 11 + Math.random() * 5,
  };
  npcs.push(npc);
}

function laneRight(h) { return { x: Math.cos(h), z: -Math.sin(h) }; }

// Setzt einen NPC auf eine Strecke in mittlerer Entfernung zum Spieler um. So
// bleibt die Verkehrsdichte rund ums Auto konstant, ohne hunderte Fahrzeuge.
function recycleNPC(npc) {
  const cands = [];
  for (let xi = 0; xi < XS.length; xi++)
    for (let zi = 0; zi < ZS.length; zi++) {
      const d = Math.hypot(XS[xi] - car.x, ZS[zi] - car.z);
      if (d > 120 && d < 620) cands.push([xi, zi]);
    }
  if (!cands.length) return;
  const [xi, zi] = cands[Math.floor(Math.random() * cands.length)];
  const from = nodeAt(xi, zi);
  const opts = neighbours(xi, zi);
  const [nxi, nzi] = opts[Math.floor(Math.random() * opts.length)];
  const to = nodeAt(nxi, nzi);
  const heading = Math.atan2(to.x - from.x, to.z - from.z);
  const r = laneRight(heading);
  const f = Math.random() * 0.8;
  npc.from = from; npc.to = to; npc.heading = heading;
  npc.x = from.x + (to.x - from.x) * f + r.x * LANE;
  npc.z = from.z + (to.z - from.z) * f + r.z * LANE;
  npc.speed = 8 + Math.random() * 4;
}

const NPC_COUNT = lowPerf ? 22 : isMobile ? 30 : 46;
for (let i = 0; i < NPC_COUNT; i++) spawnNPC(NPC_COLORS[i % NPC_COLORS.length]);
npcs.forEach(recycleNPC);   // gleich zu Beginn rund um den Startpunkt verteilen

function pickNextNode(npc) {
  const opts = neighbours(npc.to.xi, npc.to.zi)
    .filter(([xi, zi]) => !(xi === npc.from.xi && zi === npc.from.zi));
  const pool = opts.length ? opts : neighbours(npc.to.xi, npc.to.zi);
  const [nxi, nzi] = pool[Math.floor(Math.random() * pool.length)];
  npc.from = npc.to;
  npc.to = nodeAt(nxi, nzi);
}

function updateNPCs(dt, t) {
  for (const npc of npcs) {
    // Weit abgehängte Fahrzeuge nach vorn recyceln (weit jenseits der Sichtweite)
    if (Math.hypot(npc.x - car.x, npc.z - car.z) > 1000) { recycleNPC(npc); continue; }

    // Zielpunkt inkl. Spurversatz
    const r = laneRight(npc.heading);
    const tx = npc.to.x + r.x * LANE, tz = npc.to.z + r.z * LANE;
    const dx = tx - npc.x, dz = tz - npc.z;
    const dist = Math.hypot(dx, dz);

    if (dist < 5) { pickNextNode(npc); continue; }

    // Ausrichtung sanft nachführen
    let diff = Math.atan2(dx, dz) - npc.heading;
    diff = ((diff + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    npc.heading += diff * Math.min(1, 3.2 * dt);

    // Wunschtempo
    let want = npc.maxSpeed;

    // Rote/gelbe Ampel an der anstehenden Kreuzung
    const axisNS = npc.from.xi === npc.to.xi;
    const dInter = Math.hypot(npc.to.x - npc.x, npc.to.z - npc.z);
    if (dInter < 22 && dInter > 8 && phaseState(npc.to, axisNS, t) !== GRN) want = 0;

    // Vordermann nicht auffahren
    const fx = Math.sin(npc.heading), fz = Math.cos(npc.heading);
    for (const o of npcs) {
      if (o === npc) continue;
      const ox = o.x - npc.x, oz = o.z - npc.z;
      const ahead = ox * fx + oz * fz;
      if (ahead > 0 && ahead < 13 && Math.abs(ox * fz - oz * fx) < 2.4) {
        want = Math.min(want, Math.max(0, o.speed * 0.85));
      }
    }
    // Spieler ebenfalls als Hindernis werten
    {
      const ox = car.x - npc.x, oz = car.z - npc.z;
      const ahead = ox * fx + oz * fz;
      if (ahead > 0 && ahead < 13 && Math.abs(ox * fz - oz * fx) < 2.4) want = 0;
    }

    const rate = want < npc.speed ? 9 : 3.4;    // bremst schneller als es beschleunigt
    npc.speed += (want - npc.speed) * Math.min(1, rate * dt);

    npc.x += fx * npc.speed * dt;
    npc.z += fz * npc.speed * dt;
    npc.mesh.position.set(npc.x, 0, npc.z);
    npc.mesh.rotation.y = npc.heading + Math.PI;
  }
}

// ══════════════════════════════════════════════════════════════════════════
//  Spielerauto
// ══════════════════════════════════════════════════════════════════════════
const MAX_SPD = 52.8, MAX_REV = 6, ACCEL = 7.2, BRAKE = 16, DRAG = 1.6;
const STEER_SPD = 2.4, GRIP = 6.0, GRIP_HANDBRAKE = 1.5;

// Cockpit (an der Kamera befestigt → bewegt sich automatisch mit)
const wheelPivot = new THREE.Group();
(function buildCockpit() {
  const dash = new THREE.Mesh(
    new THREE.BoxGeometry(2.3, 0.34, 0.6),
    new THREE.MeshLambertMaterial({ color: 0x191b1e })
  );
  dash.position.set(0, -0.74, -0.62);
  cam.add(dash);

  const hood = new THREE.Mesh(
    new THREE.BoxGeometry(1.98, 0.08, 2.3),
    new THREE.MeshLambertMaterial({ color: 0xb43030 })
  );
  hood.position.set(0, -0.86, -2.1);
  cam.add(hood);

  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(0.2, 0.028, 8, 22),
    new THREE.MeshLambertMaterial({ color: 0x101215 })
  );
  wheelPivot.add(rim);
  const spoke = new THREE.Mesh(
    new THREE.BoxGeometry(0.36, 0.022, 0.022),
    new THREE.MeshLambertMaterial({ color: 0x101215 })
  );
  wheelPivot.add(spoke);
  wheelPivot.position.set(0, -0.6, -0.56);
  wheelPivot.rotation.x = -0.42;
  cam.add(wheelPivot);
})();

// ── Eingabe: WASD ───────────────────────────────────────────────────────────
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR') resetCar();
  if (['KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });

const touch = { left: false, right: false, gas: false, brake: false };
[['t-l','left'], ['t-r','right'], ['t-g','gas'], ['t-b','brake']].forEach(([id, prop]) => {
  const el = document.getElementById(id);
  const on  = e => { touch[prop] = true;  el.classList.add('on');    e.preventDefault(); };
  const off = e => { touch[prop] = false; el.classList.remove('on'); e.preventDefault(); };
  el.addEventListener('touchstart',  on,  { passive: false });
  el.addEventListener('touchend',    off, { passive: false });
  el.addEventListener('touchcancel', off, { passive: false });
  el.addEventListener('mousedown',   on);
  el.addEventListener('mouseup',     off);
});

function resetCar() {
  car.x = START_X; car.z = START_Z;
  car.heading = 0; car.speed = 0; car.steer = 0; car.vx = 0; car.vz = 0;
}

function updateCar(dt) {
  const gas    = keys.KeyW || touch.gas;
  const brake  = keys.KeyS || touch.brake;
  const left   = keys.KeyA || touch.left;
  const right  = keys.KeyD || touch.right;
  const handbr = keys.Space;

  // Längsdynamik
  if (gas) {
    car.speed += ACCEL * (1 - Math.abs(car.speed) / MAX_SPD * 0.72) * dt;
  } else if (brake) {
    if (car.speed > 0.2)      car.speed -= BRAKE * dt;
    else                      car.speed = Math.max(-MAX_REV, car.speed - ACCEL * 0.6 * dt);
  } else {
    car.speed -= Math.sign(car.speed) * Math.min(Math.abs(car.speed), DRAG * dt);
  }
  if (handbr) car.speed -= Math.sign(car.speed) * Math.min(Math.abs(car.speed), BRAKE * 0.8 * dt);
  car.speed = Math.max(-MAX_REV, Math.min(MAX_SPD, car.speed));

  // Lenkung
  const steerIn = (left ? -1 : 0) + (right ? 1 : 0);
  const absSp   = Math.abs(car.speed);
  const sFactor = absSp < 0.5 ? 0 : (1 - 0.42 * absSp / MAX_SPD);
  const rev     = car.speed < -0.1 ? -1 : 1;
  car.steer += (steerIn - car.steer) * 6 * dt;
  car.heading += car.steer * STEER_SPD * sFactor * rev * dt;

  // Längs-/Querzerlegung → Grip-Modell
  const fx = Math.sin(car.heading), fz = Math.cos(car.heading);
  const sx = fz, sz = -fx;
  let vSide = car.vx * sx + car.vz * sz;
  const grip = handbr ? GRIP_HANDBRAKE : GRIP;
  vSide -= vSide * Math.min(1, grip * dt);
  car.vx = fx * car.speed + sx * vSide;
  car.vz = fz * car.speed + sz * vSide;

  car.x += car.vx * dt;
  car.z += car.vz * dt;

  // Lenken erzeugt etwas Querimpuls (sonst gäbe es nie Schlupf)
  const slip = car.steer * absSp * 0.04;
  car.vx += sx * slip;
  car.vz += sz * slip;

  collideWithNPCs();
  wheelPivot.rotation.z = -car.steer * 0.9;
}

function collideWithNPCs() {
  const R = 3.4;
  for (const npc of npcs) {
    const dx = car.x - npc.x, dz = car.z - npc.z;
    const d = Math.hypot(dx, dz);
    if (d >= R || d < 0.001) continue;
    const nx = dx / d, nz = dz / d;
    const overlap = R - d;
    // Beide auseinanderschieben
    car.x += nx * overlap * 0.5;  car.z += nz * overlap * 0.5;
    npc.x -= nx * overlap * 0.5;  npc.z -= nz * overlap * 0.5;
    npc.speed *= 0.5;
    car.speed *= 0.72;
  }
}

// ══════════════════════════════════════════════════════════════════════════
//  Motorsound mit 6-Gang-Schaltung
// ══════════════════════════════════════════════════════════════════════════
const GEAR_TOPS = [0.13, 0.27, 0.43, 0.62, 0.82, 1.0];
let actx = null, engOsc = null, engGain = null, engFilt = null;
let curGear = 1, shiftAt = -1;

function initAudio() {
  if (actx) return;
  try { actx = new (AudioContext || webkitAudioContext)(); } catch (e) { return; }
  engOsc  = actx.createOscillator(); engOsc.type = 'sawtooth'; engOsc.frequency.value = 60;
  engFilt = actx.createBiquadFilter(); engFilt.type = 'lowpass';
  engFilt.frequency.value = 700; engFilt.Q.value = 5;
  engGain = actx.createGain(); engGain.gain.value = 0;
  engOsc.connect(engFilt); engFilt.connect(engGain); engGain.connect(actx.destination);
  engOsc.start();
}
addEventListener('keydown',   initAudio, { once: true });
addEventListener('mousedown', initAudio, { once: true });
addEventListener('touchstart',initAudio, { once: true });

function gearOf(frac) {
  for (let i = 0; i < GEAR_TOPS.length; i++) {
    if (frac <= GEAR_TOPS[i]) {
      const lo = i === 0 ? 0 : GEAR_TOPS[i - 1];
      return { gear: i + 1, rpm: (frac - lo) / (GEAR_TOPS[i] - lo) };
    }
  }
  return { gear: 6, rpm: 1 };
}

function updateEngine() {
  const frac = Math.abs(car.speed) / MAX_SPD;
  const g = gearOf(frac);
  if (g.gear !== curGear) { curGear = g.gear; shiftAt = performance.now(); }
  if (!actx || actx.state === 'suspended') return;
  const rpm  = 0.2 + g.rpm * 0.8;
  const dip  = (performance.now() - shiftAt) < 160 ? 0.42 : 1;   // Zugkraftunterbrechung
  const load = (keys.KeyW || touch.gas) ? 1 : 0.55;
  engOsc.frequency.setTargetAtTime(55 + rpm * 150, actx.currentTime, 0.05);
  engFilt.frequency.setTargetAtTime(420 + rpm * 1500, actx.currentTime, 0.06);
  engGain.gain.setTargetAtTime(0.055 * load * dip, actx.currentTime, 0.05);
}

function gearLabel() {
  if (car.speed < -0.3) return 'R';
  if (Math.abs(car.speed) < 0.4) return 'N';
  return String(curGear);
}

// ══════════════════════════════════════════════════════════════════════════
//  Hauptschleife
// ══════════════════════════════════════════════════════════════════════════
const clock = new THREE.Clock();
const spdEl = document.getElementById('spd');
const gearEl = document.getElementById('gear');

function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.getElapsedTime();

  updateCar(dt);
  updateSignals(t);
  updateNPCs(dt, t);
  updateEngine();

  cam.position.set(car.x, 1.28, car.z);
  cam.rotation.set(0, car.heading + Math.PI, car.steer * 0.022);

  spdEl.textContent  = Math.round(Math.abs(car.speed) * 3.6);
  gearEl.textContent = gearLabel();

  renderer.render(scene, cam);
}
loop();

}
</script>
