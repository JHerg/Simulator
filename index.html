<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fahrsimulator</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b1016;
            font-family:'Segoe UI',system-ui,Arial,sans-serif;}
  canvas{display:block;width:100vw;height:100vh;}

  /* ── Startmenü ─────────────────────────────────────── */
  #menu{
    position:fixed;inset:0;z-index:100;
    background:linear-gradient(160deg,#0d1a26,#050a10);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
    color:#dfe9f2;text-align:center;padding:20px;
  }
  #menu h1{font-size:34px;font-weight:700;letter-spacing:.04em;}
  #menu p{font-size:15px;color:#7f95a8;max-width:440px;line-height:1.6;}
  .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
  .grp{display:flex;flex-direction:column;gap:9px;align-items:center;}
  .lbl{font-size:12px;letter-spacing:.18em;color:#6d8296;text-transform:uppercase;}
  .big{
    padding:16px 46px;border:none;border-radius:14px;cursor:pointer;
    font-size:19px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,#0044cc,#0090ff);
    box-shadow:0 5px 24px rgba(0,110,255,.45);
    transition:transform .15s,box-shadow .15s;
  }
  .big:hover{transform:translateY(-2px);box-shadow:0 9px 30px rgba(0,140,255,.6);}
  .big.alt{background:linear-gradient(135deg,#a01530,#e0413f);
           box-shadow:0 5px 24px rgba(220,60,60,.45);}
  .big.alt:hover{box-shadow:0 9px 30px rgba(255,90,80,.6);}
  .opt{
    padding:10px 20px;border-radius:11px;cursor:pointer;font-size:15px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);color:#b9cbdb;
    transition:background .12s,border-color .12s,color .12s;
  }
  .opt:hover{background:rgba(255,255,255,.14);}
  .opt.sel{background:rgba(0,120,255,.5);border-color:rgba(120,190,255,.9);color:#fff;}
  #role-hint{font-size:14px;color:#9db3c6;max-width:430px;line-height:1.55;min-height:44px;}
  #keys{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .key{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
       border-radius:8px;padding:7px 13px;font-size:13px;color:#9fb3c6;}
  .key b{color:#fff;}

  /* ── Ladehinweis ───────────────────────────────────── */
  #boot{position:fixed;inset:0;z-index:200;background:#050a10;color:#4d9fd6;
        display:flex;align-items:center;justify-content:center;font-size:15px;}

  /* ── HUD ───────────────────────────────────────────── */
  #speedo{
    position:fixed;right:22px;bottom:22px;z-index:40;pointer-events:none;
    background:rgba(0,0,0,.6);border-radius:14px;padding:10px 20px;
    text-align:center;color:#fff;min-width:112px;
  }
  #spd{font-size:38px;font-weight:700;line-height:1;}
  #unit{font-size:11px;color:#8ba2b5;letter-spacing:.16em;margin-top:2px;}
  #gear{font-size:15px;color:#ffcc55;font-weight:700;margin-top:5px;}

  /* ── Touch-Steuerung (nur auf Touch-Geräten) ───────── */
  #touch{display:none;}
  .tbtn{
    position:fixed;z-index:45;border-radius:14px;
    background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);
    color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;touch-action:none;
  }
  .tbtn.on{background:rgba(255,255,255,.32);}
  @media(pointer:coarse){
    #touch{display:block;}
    #speedo{bottom:auto;top:16px;right:16px;padding:7px 14px;min-width:88px;}
    #spd{font-size:26px;}
  }
  #t-l{left:14px;bottom:20px;width:72px;height:72px;}
  #t-r{left:96px;bottom:20px;width:72px;height:72px;}
  #t-g{right:14px;bottom:20px;width:92px;height:72px;background:rgba(0,150,60,.4);}
  #t-b{right:118px;bottom:20px;width:72px;height:72px;background:rgba(170,30,30,.4);}

  /* ── Verfolgungsjagd-HUD ───────────────────────────── */
  #chase-hud{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:44;
    background:rgba(0,0,0,.68);border-radius:12px;padding:8px 18px;
    color:#fff;text-align:center;display:none;min-width:270px;pointer-events:none;
  }
  #ch-l1{font-size:14px;font-weight:700;letter-spacing:.03em;}
  #ch-bar-wrap{height:9px;background:rgba(255,255,255,.16);border-radius:5px;
               overflow:hidden;margin:7px 0 5px;}
  #ch-bar{height:100%;width:0%;border-radius:5px;
          background:linear-gradient(90deg,#ffb020,#ff3a2a);transition:width .18s;}
  #ch-l2{font-size:12px;color:#a9bccd;}

  /* ── Ergebnis ──────────────────────────────────────── */
  #result{
    position:fixed;inset:0;z-index:120;display:none;
    background:rgba(3,7,12,.82);align-items:center;justify-content:center;
  }
  #result-box{
    background:linear-gradient(160deg,#12202e,#0a1119);
    border:1px solid rgba(255,255,255,.12);border-radius:18px;
    padding:34px 44px;text-align:center;color:#e6eef5;max-width:460px;
  }
  #result-title{font-size:27px;font-weight:700;margin-bottom:12px;}
  #result-sub{font-size:15px;color:#a3b7c8;line-height:1.6;margin-bottom:22px;}
  #result-again{
    padding:13px 34px;border:none;border-radius:12px;cursor:pointer;
    font-size:16px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,#0044cc,#0090ff);
  }
</style>
</head>
<body>

<div id="boot">Lade Fahrsimulator…</div>

<div id="menu" style="display:none">
  <h1>🚗 Fahrsimulator</h1>

  <div id="m-mode" class="grp">
    <p>Wähle deinen Modus.</p>
    <div class="row">
      <button class="big"     data-mode="free">🕹 Freie Fahrt</button>
      <button class="big alt" data-mode="chase">🚨 Verfolgungsjagd</button>
    </div>
  </div>

  <div id="m-chase" style="display:none">
    <div class="grp" style="margin-bottom:20px">
      <div class="lbl">Deine Rolle</div>
      <div class="row">
        <button class="opt sel" data-role="police">👮 Polizei</button>
        <button class="opt"     data-role="thief">🕶 Dieb</button>
      </div>
    </div>
    <div class="grp" style="margin-bottom:16px">
      <div class="lbl">Schwierigkeit</div>
      <div class="row">
        <button class="opt"     data-diff="0">😊 Leicht</button>
        <button class="opt sel" data-diff="1">🙂 Mittel</button>
        <button class="opt"     data-diff="2">😤 Schwer</button>
        <button class="opt"     data-diff="3">💀 Extrem</button>
      </div>
    </div>
    <div id="role-hint"></div>
    <div class="row" style="margin-top:12px">
      <button class="big alt" id="chase-go">🚨 Jagd starten</button>
      <button class="opt" id="chase-back">← Zurück</button>
    </div>
  </div>

  <div id="keys">
    <div class="key"><b>W</b> Gas</div>
    <div class="key"><b>S</b> Bremse / Rückwärts</div>
    <div class="key"><b>A</b> Links</div>
    <div class="key"><b>D</b> Rechts</div>
    <div class="key"><b>Leertaste</b> Handbremse</div>
    <div class="key"><b>R</b> Zurücksetzen</div>
  </div>
</div>

<canvas id="canvas"></canvas>

<div id="speedo">
  <div id="spd">0</div>
  <div id="unit">KM/H</div>
  <div id="gear">N</div>
</div>

<div id="chase-hud">
  <div id="ch-l1"></div>
  <div id="ch-bar-wrap"><div id="ch-bar"></div></div>
  <div id="ch-l2"></div>
</div>

<div id="result">
  <div id="result-box">
    <div id="result-title"></div>
    <div id="result-sub"></div>
    <button id="result-again">🔄 Nochmal</button>
  </div>
</div>

<div id="touch">
  <div class="tbtn" id="t-l">◀</div>
  <div class="tbtn" id="t-r">▶</div>
  <div class="tbtn" id="t-g">GAS</div>
  <div class="tbtn" id="t-b">⛔</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

document.getElementById('boot').style.display = 'none';
document.getElementById('menu').style.display = 'flex';

// Schwierigkeitsstufen der Verfolgungsjagd
const DIFFS = [
  { name:'Leicht', aiSpeed:27, aggr:0.55, cops:1, time:200, needDmg: 60 },
  { name:'Mittel', aiSpeed:33, aggr:0.80, cops:2, time:170, needDmg: 80 },
  { name:'Schwer', aiSpeed:39, aggr:1.05, cops:3, time:145, needDmg:100 },
  { name:'Extrem', aiSpeed:45, aggr:1.35, cops:4, time:120, needDmg:125 },
];

let selRole = 'police', selDiff = 1;

const hintEl = document.getElementById('role-hint');
function refreshHint() {
  const d = DIFFS[selDiff];
  hintEl.innerHTML = selRole === 'police'
    ? `Ramme den flüchtenden Dieb gegen <b>Häuser und Bäume</b>, bis sein Wagen ` +
      `fahruntüchtig ist.<br>Du hast <b>${d.time} s</b> — sein Wrack-Wert liegt bei <b>${d.needDmg}</b>.`
    : `Schüttle <b>${d.cops} Streifenwagen</b> ab und überstehe <b>${d.time} s</b>.<br>` +
      `Wird dein Wagen in die Kulisse gerammt und zerstört, ist die Jagd vorbei.`;
}
refreshHint();

document.querySelectorAll('#menu [data-mode]').forEach(b => {
  b.addEventListener('click', () => {
    if (b.dataset.mode === 'free') {
      document.getElementById('menu').style.display = 'none';
      start({ mode: 'free' });
    } else {
      document.getElementById('m-mode').style.display = 'none';
      document.getElementById('m-chase').style.display = 'block';
    }
  });
});
document.getElementById('chase-back').addEventListener('click', () => {
  document.getElementById('m-chase').style.display = 'none';
  document.getElementById('m-mode').style.display = 'flex';
});
document.querySelectorAll('#menu [data-role]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#menu [data-role]').forEach(o => o.classList.remove('sel'));
    b.classList.add('sel'); selRole = b.dataset.role; refreshHint();
  });
});
document.querySelectorAll('#menu [data-diff]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#menu [data-diff]').forEach(o => o.classList.remove('sel'));
    b.classList.add('sel'); selDiff = +b.dataset.diff; refreshHint();
  });
});
document.getElementById('chase-go').addEventListener('click', () => {
  document.getElementById('menu').style.display = 'none';
  start({ mode: 'chase', role: selRole, diff: DIFFS[selDiff], diffName: DIFFS[selDiff].name });
});
document.getElementById('result-again').addEventListener('click', () => location.reload());

function start(OPT) {
const MODE = OPT.mode, ROLE = OPT.role, CFG = OPT.diff;

// ══════════════════════════════════════════════════════════════════════════
//  Grundgerüst
// ══════════════════════════════════════════════════════════════════════════
const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth < 700;
const lowPerf  = /Android/i.test(navigator.userAgent);

const canvas   = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isMobile });
renderer.setPixelRatio(Math.min(devicePixelRatio, lowPerf ? 1.0 : isMobile ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fc4e8);
scene.fog = new THREE.Fog(0x8fc4e8, 260, lowPerf ? 900 : 1700);

// near/far eng halten → deutlich bessere Tiefenpuffer-Auflösung (kein Z-Fighting
// zwischen Boden und Fahrbahn). far liegt knapp hinter dem Nebelende.
const cam = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.2, 1900);
scene.add(cam);

scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x4a5a44, 1.15));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.5);
sun.position.set(320, 480, 180);
scene.add(sun);

addEventListener('resize', () => {
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ══════════════════════════════════════════════════════════════════════════
//  Straßennetz (namenlos): 3 lange Nord-Süd-Straßen × 7 Querstraßen
// ══════════════════════════════════════════════════════════════════════════
const XS = [-640, -320, 0, 320, 640];                            // Nord-Süd-Straßen
const ZS = Array.from({ length: 13 }, (_, i) => i * 260);        // Querstraßen alle 260 m
const ROAD_W  = 14;            // Fahrbahnbreite
const HALF_W  = ROAD_W / 2;
const LANE    = 3.5;           // Spurversatz von der Mittellinie
const Z_MIN = ZS[0] - 220,             Z_MAX = ZS[ZS.length - 1] + 220;
const X_MIN = XS[0] - 320,             X_MAX = XS[XS.length - 1] + 320;

// Untergrund. polygonOffset drückt ihn im Tiefenpuffer nach hinten, damit die
// Fahrbahn bei flachem Blickwinkel garantiert obenauf liegt.
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(5000, 5000),
  new THREE.MeshLambertMaterial({
    color: 0x5c7050,
    polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 4,
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, 0, (Z_MIN + Z_MAX) / 2);
scene.add(ground);

const asphalt = new THREE.MeshLambertMaterial({ color: 0x35383c });

// Nord-Süd-Fahrbahnen
XS.forEach(x => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, Z_MAX - Z_MIN), asphalt);
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, 0.06, (Z_MIN + Z_MAX) / 2);
  scene.add(m);
});
// Ost-West-Fahrbahnen (minimal höher → keine Überlappung an den Kreuzungen)
ZS.forEach(z => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(X_MAX - X_MIN, ROAD_W), asphalt);
  m.rotation.x = -Math.PI / 2;
  m.position.set((X_MIN + X_MAX) / 2, 0.07, z);
  scene.add(m);
});

// ── Mittellinien-Striche (ein einziger InstancedMesh für alles) ──────────────
(function buildLaneDashes() {
  const DASH_L = 4, GAP = 8, STEP = DASH_L + GAP;
  const spots = [];

  XS.forEach(x => {
    for (let z = Z_MIN + STEP; z < Z_MAX; z += STEP)
      if (!ZS.some(cz => Math.abs(z - cz) < HALF_W + 6)) spots.push({ x, z, rot: 0 });
  });
  ZS.forEach(z => {
    for (let x = X_MIN + STEP; x < X_MAX; x += STEP)
      if (!XS.some(cx => Math.abs(x - cx) < HALF_W + 6)) spots.push({ x, z, rot: Math.PI / 2 });
  });

  const geo = new THREE.PlaneGeometry(0.34, DASH_L);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xe8e4d8,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4,
  });
  const inst = new THREE.InstancedMesh(geo, mat, spots.length);
  const dummy = new THREE.Object3D();
  spots.forEach((s, i) => {
    dummy.position.set(s.x, 0.14, s.z);
    dummy.rotation.set(-Math.PI / 2, 0, s.rot);
    dummy.updateMatrix();
    inst.setMatrixAt(i, dummy.matrix);
  });
  inst.instanceMatrix.needsUpdate = true;
  scene.add(inst);
})();

// ══════════════════════════════════════════════════════════════════════════
//  Kulisse für die Verfolgungsjagd: Häuser & Bäume (feste Hindernisse)
//  Alles über InstancedMesh → nur vier Draw-Calls trotz tausender Objekte.
//  Kollisionsdaten liegen zusätzlich in einem Raster-Index für schnelle Abfrage.
// ══════════════════════════════════════════════════════════════════════════
const obstacles = [];
const OB_CELL = 64;
const obGrid = new Map();
const obKey = (x, z) => Math.floor(x / OB_CELL) + ',' + Math.floor(z / OB_CELL);

function addObstacle(o) {
  obstacles.push(o);
  const k = obKey(o.x, o.z);
  if (!obGrid.has(k)) obGrid.set(k, []);
  obGrid.get(k).push(o);
}
function nearbyObstacles(x, z, out) {
  out.length = 0;
  const cx = Math.floor(x / OB_CELL), cz = Math.floor(z / OB_CELL);
  for (let i = -1; i <= 1; i++)
    for (let j = -1; j <= 1; j++) {
      const arr = obGrid.get((cx + i) + ',' + (cz + j));
      if (arr) for (const o of arr) out.push(o);
    }
  return out;
}

function buildScenery() {
  const HOUSE_COLS = [0xc9b79a, 0xb8a088, 0xd6c4a8, 0xa8917c, 0xc0a58c, 0x9d8a76];
  const ROOF_COLS  = [0x7d3b2e, 0x5f4436, 0x8a4634, 0x4a4a52];
  let seed = 20250813;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) & 0x7fffffff; return seed / 0x7fffffff; };

  // Auf schwachen Geräten dünner bebauen – die Kulisse ist der teuerste Posten
  const H_STEP = lowPerf ? 58 : isMobile ? 44 : 34;
  const T_STEP = lowPerf ? 46 : isMobile ? 34 : 24;

  const houses = [], trees = [];
  // Bebauung entlang der Nord-Süd-Achsen (Querstraßen bleiben frei)
  XS.forEach(cx => {
    for (let z = Z_MIN + 18; z < Z_MAX; z += H_STEP) {
      if (ZS.some(cz => Math.abs(z - cz) < HALF_W + 12)) continue;
      [-1, 1].forEach(s => houses.push({ x: cx + s * 21, z }));
    }
    for (let z = Z_MIN + 9; z < Z_MAX; z += T_STEP) {
      if (ZS.some(cz => Math.abs(z - cz) < HALF_W + 9)) continue;
      [-1, 1].forEach(s => trees.push({ x: cx + s * 11.5, z }));
    }
  });
  // Bebauung entlang der Querstraßen
  ZS.forEach(cz => {
    for (let x = X_MIN + 18; x < X_MAX; x += H_STEP) {
      if (XS.some(cx => Math.abs(x - cx) < HALF_W + 12)) continue;
      [-1, 1].forEach(s => houses.push({ x, z: cz + s * 21 }));
    }
    for (let x = X_MIN + 9; x < X_MAX; x += T_STEP) {
      if (XS.some(cx => Math.abs(x - cx) < HALF_W + 9)) continue;
      [-1, 1].forEach(s => trees.push({ x, z: cz + s * 11.5 }));
    }
  });

  // ── Häuser: Körper + Dach ──
  const bodyInst = new THREE.InstancedMesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshLambertMaterial(), houses.length);
  const roofInst = new THREE.InstancedMesh(
    new THREE.ConeGeometry(1, 1, 4),
    new THREE.MeshLambertMaterial(), houses.length);
  const d = new THREE.Object3D(), col = new THREE.Color();

  houses.forEach((h, i) => {
    const w = 11 + rnd() * 6, dp = 10 + rnd() * 5, ht = 7 + rnd() * 7;
    d.position.set(h.x, ht / 2, h.z);
    d.rotation.set(0, 0, 0);
    d.scale.set(w, ht, dp);
    d.updateMatrix(); bodyInst.setMatrixAt(i, d.matrix);
    bodyInst.setColorAt(i, col.setHex(HOUSE_COLS[(rnd() * HOUSE_COLS.length) | 0]));

    const rh = 2.4 + rnd() * 1.8;
    d.position.set(h.x, ht + rh / 2, h.z);
    d.rotation.set(0, Math.PI / 4, 0);            // Vierkant-Dach auf den Baukörper drehen
    d.scale.set(w * 0.78, rh, dp * 0.78);
    d.updateMatrix(); roofInst.setMatrixAt(i, d.matrix);
    roofInst.setColorAt(i, col.setHex(ROOF_COLS[(rnd() * ROOF_COLS.length) | 0]));

    addObstacle({ x: h.x, z: h.z, hw: w / 2, hd: dp / 2 });
  });
  bodyInst.instanceMatrix.needsUpdate = roofInst.instanceMatrix.needsUpdate = true;
  bodyInst.frustumCulled = roofInst.frustumCulled = false;
  scene.add(bodyInst, roofInst);

  // ── Bäume: Stamm + Krone ──
  const trunkInst = new THREE.InstancedMesh(
    new THREE.CylinderGeometry(0.19, 0.26, 1, 6),
    new THREE.MeshLambertMaterial({ color: 0x5a4028 }), trees.length);
  const crownInst = new THREE.InstancedMesh(
    new THREE.SphereGeometry(1, 7, 6),
    new THREE.MeshLambertMaterial(), trees.length);
  const GREENS = [0x2f6b2a, 0x3c7c33, 0x275a25, 0x46873a];

  trees.forEach((t, i) => {
    const th = 3.4 + rnd() * 2.4, cr = 1.7 + rnd() * 1.1;
    d.rotation.set(0, 0, 0);
    d.position.set(t.x, th / 2, t.z); d.scale.set(1, th, 1);
    d.updateMatrix(); trunkInst.setMatrixAt(i, d.matrix);

    d.position.set(t.x, th + cr * 0.55, t.z); d.scale.set(cr, cr * 1.15, cr);
    d.updateMatrix(); crownInst.setMatrixAt(i, d.matrix);
    crownInst.setColorAt(i, col.setHex(GREENS[(rnd() * GREENS.length) | 0]));

    addObstacle({ x: t.x, z: t.z, r: 0.7 });
  });
  trunkInst.instanceMatrix.needsUpdate = crownInst.instanceMatrix.needsUpdate = true;
  trunkInst.frustumCulled = crownInst.frustumCulled = false;
  scene.add(trunkInst, crownInst);
}

// Prüft ein Fahrzeug gegen die Kulisse. Rückgabe: Aufprallhärte (0 = kein Treffer).
const _obScratch = [];
function hitObstacles(e, halfW) {
  let impact = 0;
  for (const o of nearbyObstacles(e.x, e.z, _obScratch)) {
    if (o.r !== undefined) {
      const dx = e.x - o.x, dz = e.z - o.z;
      const dd = Math.hypot(dx, dz), R = o.r + halfW;
      if (dd < R && dd > 0.001) {
        e.x = o.x + dx / dd * R; e.z = o.z + dz / dd * R;
        impact = Math.max(impact, Math.abs(e.speed));
        e.speed *= 0.45;
      }
    } else {
      const dx = e.x - o.x, dz = e.z - o.z;
      const ex = o.hw + halfW, ez = o.hd + halfW;
      if (Math.abs(dx) < ex && Math.abs(dz) < ez) {
        const ox = ex - Math.abs(dx), oz = ez - Math.abs(dz);
        if (ox < oz) e.x += Math.sign(dx || 1) * ox; else e.z += Math.sign(dz || 1) * oz;
        impact = Math.max(impact, Math.abs(e.speed));
        e.speed *= 0.3;
      }
    }
  }
  return impact;
}

if (MODE === 'chase') buildScenery();

// ══════════════════════════════════════════════════════════════════════════
//  Ampeln – an jeder Kreuzung vier Stück, je Zufahrt eine
// ══════════════════════════════════════════════════════════════════════════
const RED = 0, YEL = 1, GRN = 2;
const BULB_ON  = [0xff2a17, 0xffb300, 0x28d94a].map(c => new THREE.Color(c));
const BULB_OFF = new THREE.Color(0x14171a);

const grid = [];            // grid[xi][zi] → gemeinsames Kreuzungsobjekt
const signals = [];         // { x, z, a, inter, axisNS, last }

XS.forEach((x, xi) => {
  grid[xi] = [];
  ZS.forEach((z, zi) => {
    const inter = { xi, zi, x, z, phase: Math.random() * 28 };
    grid[xi][zi] = inter;
    const O = HALF_W + 2;   // seitlicher Versatz an den Fahrbahnrand
    const B = HALF_W + 3;   // Abstand vor der Kreuzung
    // Jede Ampel steht rechts der Zufahrt und blickt dem Fahrer entgegen
    signals.push({ x: x + O, z: z - B, a:  Math.PI,     inter, axisNS: true,  last: -1 });
    signals.push({ x: x - O, z: z + B, a:  0,           inter, axisNS: true,  last: -1 });
    signals.push({ x: x - B, z: z - O, a: -Math.PI / 2, inter, axisNS: false, last: -1 });
    signals.push({ x: x + B, z: z + O, a:  Math.PI / 2, inter, axisNS: false, last: -1 });
  });
});

// Masten, Gehäuse und Lampen als InstancedMesh: drei Draw-Calls statt gut 1300
// Einzel-Meshes. Die Lampenfarbe läuft über instanceColor.
const nSig = signals.length;
const darkMat  = new THREE.MeshLambertMaterial({ color: 0x1c1f22 });
const poleInst = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.09,0.11,5.2,6), darkMat, nSig);
const caseInst = new THREE.InstancedMesh(new THREE.BoxGeometry(0.46,1.5,0.3), darkMat, nSig);
const bulbInst = new THREE.InstancedMesh(new THREE.CircleGeometry(0.14,10),
                   new THREE.MeshBasicMaterial(), nSig * 3);
{
  const d = new THREE.Object3D();
  signals.forEach((s, i) => {
    d.scale.set(1,1,1);
    d.position.set(s.x, 2.6, s.z); d.rotation.set(0, 0, 0);
    d.updateMatrix(); poleInst.setMatrixAt(i, d.matrix);
    d.position.set(s.x, 5.3, s.z); d.rotation.set(0, s.a, 0);
    d.updateMatrix(); caseInst.setMatrixAt(i, d.matrix);
    // Lampen sitzen leicht vor dem Gehäuse, in Blickrichtung des Fahrers
    const ox = Math.sin(s.a) * 0.16, oz = Math.cos(s.a) * 0.16;
    [0.52, 0, -0.52].forEach((yo, k) => {
      d.position.set(s.x + ox, 5.3 + yo, s.z + oz);
      d.updateMatrix(); bulbInst.setMatrixAt(i * 3 + k, d.matrix);
      bulbInst.setColorAt(i * 3 + k, BULB_OFF);
    });
  });
  poleInst.instanceMatrix.needsUpdate = true;
  caseInst.instanceMatrix.needsUpdate = true;
  bulbInst.instanceMatrix.needsUpdate = true;
  poleInst.frustumCulled = caseInst.frustumCulled = bulbInst.frustumCulled = false;
  scene.add(poleInst, caseInst, bulbInst);
}

// 28-Sekunden-Zyklus: NS 12 s grün, 2 s gelb → EW 12 s grün, 2 s gelb
function phaseState(inter, axisNS, t) {
  const c = (t + inter.phase) % 28;
  if (c < 12) return axisNS ? GRN : RED;
  if (c < 14) return axisNS ? YEL : RED;
  if (c < 26) return axisNS ? RED : GRN;
  return axisNS ? RED : YEL;
}

function updateSignals(t) {
  let dirty = false;
  for (let i = 0; i < nSig; i++) {
    const s = signals[i];
    const st = phaseState(s.inter, s.axisNS, t);
    if (st === s.last) continue;      // Farben nur beim Phasenwechsel schreiben
    s.last = st; dirty = true;
    for (let k = 0; k < 3; k++)
      bulbInst.setColorAt(i * 3 + k, k === st ? BULB_ON[k] : BULB_OFF);
  }
  if (dirty) bulbInst.instanceColor.needsUpdate = true;
}

// ══════════════════════════════════════════════════════════════════════════
//  Verkehr – NPCs fahren das Raster entlang und halten bei Rot
// ══════════════════════════════════════════════════════════════════════════
// Start auf der langen Mittelachse, rund 130 m vor der nächsten Ampelkreuzung
// Mittig im Netz starten, damit in alle Richtungen Stadt liegt
const START_X = XS[(XS.length / 2) | 0] + LANE, START_Z = ZS[1] - 130;
const car = { x: START_X, z: START_Z, heading: 0, speed: 0, steer: 0, vx: 0, vz: 0, damage: 0 };
let _shake = 0;

const nodeAt = (xi, zi) => grid[xi][zi];
function neighbours(xi, zi) {
  const n = [];
  if (xi > 0)             n.push([xi - 1, zi]);
  if (xi < XS.length - 1) n.push([xi + 1, zi]);
  if (zi > 0)             n.push([xi, zi - 1]);
  if (zi < ZS.length - 1) n.push([xi, zi + 1]);
  return n;
}

const NPC_COLORS = [0xcc3333, 0x2255bb, 0xdddddd, 0x333333, 0x228855, 0xddaa22, 0x884499, 0x22aabb];

    w.rotation.z = Math.PI / 2; w.position.set(rx, 0.34, rz); g.add(w);

const NPC_COUNT = lowPerf ? 34 : isMobile ? 54 : 90;

// Ein NPC-Auto besteht aus mehreren Bauteilen; jedes Bauteil wird über ALLE
// Autos hinweg instanziert. Damit bleibt es bei sieben Draw-Calls, egal wie
// viele Fahrzeuge unterwegs sind. Die Nase zeigt lokal nach +Z.
// Die Silhouette muss die Fahrtrichtung auf einen Blick verraten: lange flache
// Haube vorn, Kabine weit nach hinten gerueckt, dunkle Frontscheibe und Grill.
// Eine fast symmetrische Karosserie liest sich sonst aus der Distanz falsch.
const NPC_PART_DEFS = [
  { key:'sill', geo: new THREE.BoxGeometry(1.70, 0.42, 4.00), color: 0x0b0b0d, offs: [[0, 0.42, 0]] },
  { key:'body', geo: new THREE.BoxGeometry(1.82, 0.55, 3.90), paint: true, offs: [[0, 0.80, 0]] },
  { key:'cab', geo: new THREE.BoxGeometry(1.62, 0.60, 1.90), paint: true, offs: [[0, 1.37, -0.55]] },
  { key:'glass', geo: new THREE.BoxGeometry(1.50, 0.52, 0.07), color: 0x101c26, rotX: -0.38,
    offs: [[0, 1.38, 0.36]] },                       // geneigte Frontscheibe
  { key:'grill', geo: new THREE.BoxGeometry(1.46, 0.20, 0.08), color: 0x0b0b0d,
    offs: [[0, 0.66, 1.94]] },                       // Kuehlergrill
  { key:'wheel', geo: new THREE.CylinderGeometry(0.34, 0.34, 0.24, 10), color: 0x0b0b0d, rotZ: Math.PI / 2,
    offs: [[-0.9,0.34,1.25],[0.9,0.34,1.25],[-0.9,0.34,-1.25],[0.9,0.34,-1.25]] },
  { key:'head', geo: new THREE.BoxGeometry(0.44,0.20,0.09), color: 0xfff6cc, basic: true,
    offs: [[-0.62,0.86,1.95],[0.62,0.86,1.95]] },    // Scheinwerfer vorn
  { key:'tail', geo: new THREE.BoxGeometry(0.44,0.20,0.09), color: 0xdd1111, basic: true,
    offs: [[-0.62,0.90,-1.95],[0.62,0.90,-1.95]] },  // Ruecklichter hinten
];

const npcParts = NPC_PART_DEFS.map(d => {
  if (d.rotZ) d.geo.rotateZ(d.rotZ);               // Raddrehung fest einbacken
  if (d.rotX) d.geo.rotateX(d.rotX);               // Scheibenneigung fest einbacken
  const mat = d.basic
    ? new THREE.MeshBasicMaterial({ color: d.color })
    : new THREE.MeshStandardMaterial({ color: d.color ?? 0xffffff,
                                       metalness: d.paint ? 0.32 : 0.2,
                                       roughness: d.paint ? 0.42 : 0.7 });
  const inst = new THREE.InstancedMesh(d.geo, mat, NPC_COUNT * d.offs.length);
  inst.frustumCulled = false;                      // Instanzen decken die ganze Karte ab
  scene.add(inst);
  return { key: d.key, inst, paint: !!d.paint, per: d.offs.length,
           local: d.offs.map(([x,y,z]) => new THREE.Matrix4().makeTranslation(x,y,z)) };
});

const npcs = [];
function spawnNPC(color) {
  const i = npcs.length;
  const xi = Math.floor(Math.random() * XS.length);
  const zi = Math.floor(Math.random() * ZS.length);
  const from = nodeAt(xi, zi);
  const opts = neighbours(xi, zi);
  const [nxi, nzi] = opts[Math.floor(Math.random() * opts.length)];
  const to = nodeAt(nxi, nzi);
  const heading = Math.atan2(to.x - from.x, to.z - from.z);
  const r = laneRight(heading);
  const f = 0.1 + Math.random() * 0.75;   // irgendwo auf der Strecke, nicht auf der Kreuzung
  npcs.push({
    from, to, heading,
    x: from.x + (to.x - from.x) * f + r.x * LANE,
    z: from.z + (to.z - from.z) * f + r.z * LANE,
    speed: 8 + Math.random() * 4, maxSpeed: 11 + Math.random() * 5,
  });
  // Lackfarbe einmalig setzen
  const col = new THREE.Color(color);
  for (const p of npcParts)
    if (p.paint) for (let k = 0; k < p.per; k++) p.inst.setColorAt(i * p.per + k, col);
}

// Alle Bauteil-Matrizen aus Position und Kurs der Autos neu aufbauen
const _npcQ = new THREE.Quaternion(), _npcV = new THREE.Vector3();
const _npcS = new THREE.Vector3(1,1,1), _npcM = new THREE.Matrix4(), _npcO = new THREE.Matrix4();
const _UP = new THREE.Vector3(0,1,0);
function syncNPCMeshes() {
  for (let i = 0; i < npcs.length; i++) {
    const n = npcs[i];
    _npcQ.setFromAxisAngle(_UP, n.heading);        // +Z-Nase → Fahrtrichtung
    _npcV.set(n.x, 0, n.z);
    _npcM.compose(_npcV, _npcQ, _npcS);
    for (const p of npcParts)
      for (let k = 0; k < p.per; k++)
        p.inst.setMatrixAt(i * p.per + k, _npcO.multiplyMatrices(_npcM, p.local[k]));
  }
  for (const p of npcParts) p.inst.instanceMatrix.needsUpdate = true;
}

function laneRight(h) { return { x: Math.cos(h), z: -Math.sin(h) }; }

// Setzt einen NPC auf eine Strecke in mittlerer Entfernung zum Spieler um. So
// bleibt die Verkehrsdichte rund ums Auto konstant, ohne hunderte Fahrzeuge.
function recycleNPC(npc) {
  const cands = [];
  for (let xi = 0; xi < XS.length; xi++)
    for (let zi = 0; zi < ZS.length; zi++) {
      const d = Math.hypot(XS[xi] - car.x, ZS[zi] - car.z);
      if (d > 120 && d < 620) cands.push([xi, zi]);
    }
  if (!cands.length) return;
  const [xi, zi] = cands[Math.floor(Math.random() * cands.length)];
  const from = nodeAt(xi, zi);
  const opts = neighbours(xi, zi);
  const [nxi, nzi] = opts[Math.floor(Math.random() * opts.length)];
  const to = nodeAt(nxi, nzi);
  const heading = Math.atan2(to.x - from.x, to.z - from.z);
  const r = laneRight(heading);
  const f = Math.random() * 0.8;
  npc.from = from; npc.to = to; npc.heading = heading;
  npc.x = from.x + (to.x - from.x) * f + r.x * LANE;
  npc.z = from.z + (to.z - from.z) * f + r.z * LANE;
  npc.speed = 8 + Math.random() * 4;
}

for (let i = 0; i < NPC_COUNT; i++) spawnNPC(NPC_COLORS[i % NPC_COLORS.length]);
npcs.forEach(recycleNPC);   // gleich zu Beginn rund um den Startpunkt verteilen

function pickNextNode(npc) {
  const opts = neighbours(npc.to.xi, npc.to.zi)
    .filter(([xi, zi]) => !(xi === npc.from.xi && zi === npc.from.zi));
  const pool = opts.length ? opts : neighbours(npc.to.xi, npc.to.zi);
  const [nxi, nzi] = pool[Math.floor(Math.random() * pool.length)];
  npc.from = npc.to;
  npc.to = nodeAt(nxi, nzi);
}

function updateNPCs(dt, t) {
  for (const npc of npcs) {
    // Weit abgehängte Fahrzeuge nach vorn recyceln (weit jenseits der Sichtweite)
    if (Math.hypot(npc.x - car.x, npc.z - car.z) > 1000) { recycleNPC(npc); continue; }

    // Zielpunkt inkl. Spurversatz
    const r = laneRight(npc.heading);
    const tx = npc.to.x + r.x * LANE, tz = npc.to.z + r.z * LANE;
    const dx = tx - npc.x, dz = tz - npc.z;
    const dist = Math.hypot(dx, dz);

    if (dist < 5) { pickNextNode(npc); continue; }

    // Ausrichtung sanft nachführen
    let diff = Math.atan2(dx, dz) - npc.heading;
    diff = ((diff + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    npc.heading += diff * Math.min(1, 3.2 * dt);

    // Wunschtempo
    let want = npc.maxSpeed;

    // Rote/gelbe Ampel an der anstehenden Kreuzung
    const axisNS = npc.from.xi === npc.to.xi;
    const dInter = Math.hypot(npc.to.x - npc.x, npc.to.z - npc.z);
    if (dInter < 22 && dInter > 8 && phaseState(npc.to, axisNS, t) !== GRN) want = 0;

    // Vordermann nicht auffahren
    const fx = Math.sin(npc.heading), fz = Math.cos(npc.heading);
    for (const o of npcs) {
      if (o === npc) continue;
      const ox = o.x - npc.x, oz = o.z - npc.z;
      const ahead = ox * fx + oz * fz;
      if (ahead > 0 && ahead < 13 && Math.abs(ox * fz - oz * fx) < 2.4) {
        want = Math.min(want, Math.max(0, o.speed * 0.85));
      }
    }
    // Spieler ebenfalls als Hindernis werten
    {
      const ox = car.x - npc.x, oz = car.z - npc.z;
      const ahead = ox * fx + oz * fz;
      if (ahead > 0 && ahead < 13 && Math.abs(ox * fz - oz * fx) < 2.4) want = 0;
    }

    const rate = want < npc.speed ? 9 : 3.4;    // bremst schneller als es beschleunigt
    npc.speed += (want - npc.speed) * Math.min(1, rate * dt);

    npc.x += fx * npc.speed * dt;
    npc.z += fz * npc.speed * dt;
  }
  syncNPCMeshes();
}

// ══════════════════════════════════════════════════════════════════════════
//  Verfolgungsjagd: Gegnerfahrzeuge, Ramm-Physik, Sieg/Niederlage
// ══════════════════════════════════════════════════════════════════════════
const chasers = [];
let chaseTime = MODE === 'chase' ? CFG.time : 0;
let chaseOver = false, chaseIntroT = 2.5;

function makeBeacon(color) {
  const m = new THREE.Mesh(
    new THREE.CylinderGeometry(1.5, 1.5, 30, 10, 1, true),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.26,
                                  side: THREE.DoubleSide, depthWrite: false })
  );
  m.position.y = 15;
  return m;
}

// Blaulicht-Balken fürs Polizeiauto
function addLightBar(g) {
  const mat = new THREE.MeshBasicMaterial({ color: 0x2255ff });
  const bar = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.17, 0.34), mat);
  bar.position.set(0, 1.82, -0.2);
  g.add(bar);
  return mat;
}

function spawnChaser(role, idx) {
  // Gegner startet auf der Route, ein Stück vom Spieler entfernt
  const zi = Math.min(ZS.length - 1, Math.max(0, 1 + idx));
  const from = nodeAt(1, zi), to = nodeAt(1, Math.min(ZS.length - 1, zi + 1));
  const g = buildCarMesh(role === 'police' ? 0xf2f2f2 : 0x1b1b20);
  if (role === 'police') {
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(1.84, 0.18, 3.9),
      new THREE.MeshStandardMaterial({ color: 0x0033aa }));
    stripe.position.y = 1.02; g.add(stripe);
  }
  const lightMat = role === 'police' ? addLightBar(g) : null;
  const beacon = makeBeacon(role === 'police' ? 0x3377ff : 0xff3322);
  g.add(beacon);
  scene.add(g);

  // Immer innerhalb der Fahrbahn aufstellen (Häuserzeile beginnt bei ±21 m),
  // sonst starten äußere Wagen direkt in einer Hauswand. Bezug ist die Straße,
  // auf der der Spieler gerade steht – nicht ein fester Index.
  const roadX = XS.reduce((b, x) => Math.abs(x - car.x) < Math.abs(b - car.x) ? x : b, XS[0]);
  const a = {
    mesh: g, lightMat, role, from, to,
    x: roadX + (idx % 2 === 0 ? -3.4 : 3.4),
    z: car.z + (role === 'police' ? -(58 + idx * 30) : 95),
    heading: 0, speed: 12, pushX: 0, pushZ: 0, damage: 0, blink: 0,
  };
  chasers.push(a);
  return a;
}

function aiPickNode(a) {
  const opts = neighbours(a.to.xi, a.to.zi)
    .filter(([xi, zi]) => !(xi === a.from.xi && zi === a.from.zi));
  const pool = opts.length ? opts : neighbours(a.to.xi, a.to.zi);
  let best = pool[0], bestScore = -Infinity;
  for (const [xi, zi] of pool) {
    const n = nodeAt(xi, zi);
    const d = Math.hypot(n.x - car.x, n.z - car.z);
    // Polizei will zum Spieler, der Dieb möglichst weit weg
    const score = (a.role === 'police' ? -d : d) + Math.random() * 40;
    if (score > bestScore) { bestScore = score; best = [xi, zi]; }
  }
  a.from = a.to;
  a.to = nodeAt(best[0], best[1]);
}

// Grobe Ausweichlenkung: liegt ~13 m voraus ein Hindernis, zur freien Seite ziehen.
// Ohne das pflügt die KI im Direktverfolgungs-Modus quer durch die Häuserzeile.
const _avoidScratch = [];
function avoidBias(a) {
  const fx = Math.sin(a.heading), fz = Math.cos(a.heading);
  const px = a.x + fx * 13, pz = a.z + fz * 13;
  for (const o of nearbyObstacles(px, pz, _avoidScratch)) {
    const dx = px - o.x, dz = pz - o.z;
    const ex = (o.r !== undefined ? o.r : o.hw) + 3.2;
    const ez = (o.r !== undefined ? o.r : o.hd) + 3.2;
    if (Math.abs(dx) < ex && Math.abs(dz) < ez) {
      const rx = Math.cos(a.heading), rz = -Math.sin(a.heading);   // Rechts-Vektor
      return (dx * rx + dz * rz) > 0 ? 1.7 : -1.7;
    }
  }
  return 0;
}

function updateChasers(dt) {
  for (const a of chasers) {
    if (a.lightMat && !a.wrecked) {
      a.blink += dt;
      a.lightMat.color.setHex(a.blink % 0.44 < 0.22 ? 0x2255ff : 0xff2200);
    }
    if (chaseOver || a.wrecked) continue;

    const dPlayer = Math.hypot(car.x - a.x, car.z - a.z);

    // Zielpunkt: nah dran direkt aufs Auto (Rammkurs), sonst dem Straßennetz folgen
    let tx, tz;
    if (a.role === 'police' && dPlayer < 18 + CFG.aggr * 14) {
      tx = car.x + (car.vx || 0) * 0.55;
      tz = car.z + (car.vz || 0) * 0.55;
    } else {
      const r = laneRight(a.heading);
      tx = a.to.x + r.x * LANE; tz = a.to.z + r.z * LANE;
      if (Math.hypot(tx - a.x, tz - a.z) < 14) { aiPickNode(a); continue; }
    }

    let diff = Math.atan2(tx - a.x, tz - a.z) - a.heading;
    diff = ((diff + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    // Aggressivere Stufen lenken schärfer nach; Hindernisse verbiegen den Kurs
    a.heading += diff * Math.min(1, (2.4 + CFG.aggr * 1.2) * dt) + avoidBias(a) * dt;

    // Während des Countdowns stehen lassen. Das Tempo bleibt bewusst unter dem
    // Maximum des Spielers (52,8 m/s) — sonst wäre Entkommen unmöglich.
    const want = chaseIntroT > 0 ? 0 : CFG.aiSpeed;
    a.speed += (want - a.speed) * Math.min(1, 2.2 * dt);

    a.x += Math.sin(a.heading) * a.speed * dt + a.pushX * dt;
    a.z += Math.cos(a.heading) * a.speed * dt + a.pushZ * dt;
    a.pushX *= 0.88; a.pushZ *= 0.88;

    // Kulisse: Aufprall kostet Substanz — genau darauf zielt die Jagd ab
    const imp = hitObstacles(a, 1.7);
    if (imp > 6) {
      // Der Dieb soll an der Kulisse zerbrechen – das ist das Ziel der Polizei.
      // Streifenwagen stecken Streifschüsse dagegen weg, sonst zerlegen sie sich selbst.
      a.damage += (imp - 6) * (a.role === 'thief' ? 1.9 : 0.4);
      _shake = Math.max(_shake, dPlayer < 45 ? 0.10 : 0);
    }
    // Auch Verfolger können schrottgefahren werden → Gegenwehr für den Dieb
    if (a.role === 'police' && a.damage >= 110 && !a.wrecked) {
      a.wrecked = true; a.speed = 0; a.pushX = a.pushZ = 0;
      if (a.lightMat) a.lightMat.color.setHex(0x332222);
      toastChase('🚓 Ein Streifenwagen ist ausgefallen!');
    }

    a.mesh.position.set(a.x, 0, a.z);
    a.mesh.rotation.y = a.heading;   // Karosserie zeigt lokal nach +Z
  }
}

// Rammen — beidseitig: wer mit Wucht hineinfährt, schiebt den anderen weg.
// Nur so kann die Polizei den Spieler in eine Hauswand drängen (und umgekehrt).
function ramChasers() {
  for (const a of chasers) {
    if (a.wrecked) continue;
    const dx = car.x - a.x, dz = car.z - a.z;
    const d = Math.hypot(dx, dz);
    if (d >= 3.7 || d < 0.001) continue;
    const nx = dx / d, nz = dz / d;              // Normale: vom Gegner zum Spieler
    const ov = 3.7 - d;
    car.x += nx * ov * 0.5; car.z += nz * ov * 0.5;
    a.x -= nx * ov * 0.5;   a.z -= nz * ov * 0.5;

    // Anteil der Spielergeschwindigkeit, der in den Gegner hineindrückt.
    // Maßgeblich ist der echte Geschwindigkeitsvektor, nicht nur die Längsachse –
    // sonst überträgt ein seitliches Eindriften überhaupt keine Wucht.
    const pvx = car.vx || 0, pvz = car.vz || 0;
    const intoFoe = -(pvx * nx + pvz * nz);
    if (intoFoe > 0) {
      a.pushX -= nx * intoFoe * 0.85;
      a.pushZ -= nz * intoFoe * 0.85;
      if (intoFoe > 8) a.damage += (intoFoe - 8) * 0.32;
    }
    // …und umgekehrt der Anteil des Gegners, der in den Spieler drückt
    // (inklusive Schub aus einem vorherigen Rempler)
    const avx = Math.sin(a.heading) * a.speed + a.pushX;
    const avz = Math.cos(a.heading) * a.speed + a.pushZ;
    const intoMe = avx * nx + avz * nz;
    if (intoMe > 0) {
      car.vx += nx * intoMe * 0.6;               // wirkt im nächsten Frame als Querdrift
      car.vz += nz * intoMe * 0.6;
      if (intoMe > 10) car.damage = Math.min(100, car.damage + (intoMe - 10) * 0.20);
    }
    a.speed *= 0.88; car.speed *= 0.9;
    if (Math.max(intoFoe, intoMe) > 8) _shake = Math.max(_shake, 0.15);
  }
}

let _toastT = 0;
function toastChase(msg) {
  const el = document.getElementById('ch-l2');
  if (el) { el.textContent = msg; _toastT = 2.2; }
}

function endChase(won, msg) {
  chaseOver = true;
  document.getElementById('result-title').textContent = won ? '🏆 Gewonnen!' : '💥 Verloren';
  document.getElementById('result-title').style.color = won ? '#7ee08a' : '#ff7f6e';
  document.getElementById('result-sub').innerHTML = msg;
  document.getElementById('result').style.display = 'flex';
}

function updateChase(dt) {
  if (MODE !== 'chase' || chaseOver) return;
  const hud = document.getElementById('chase-hud');
  hud.style.display = 'block';

  if (chaseIntroT > 0) {
    chaseIntroT -= dt;
    document.getElementById('ch-l1').textContent =
      ROLE === 'police' ? '👮 Bereitmachen…' : '🕶 Bereitmachen…';
    document.getElementById('ch-l2').textContent =
      'Start in ' + Math.ceil(chaseIntroT) + ' …';
    return;
  }

  chaseTime -= dt;
  const target = chasers[0];

  if (ROLE === 'police') {
    const pct = Math.min(100, target.damage / CFG.needDmg * 100);
    document.getElementById('ch-bar').style.width = pct + '%';
    document.getElementById('ch-l1').textContent =
      `👮 Dieb stoppen — Schaden ${Math.round(pct)} %`;
    document.getElementById('ch-l2').textContent =
      `⏱ ${Math.max(0, Math.ceil(chaseTime))} s · Abstand ${Math.round(Math.hypot(car.x-target.x, car.z-target.z))} m`;
    if (target.damage >= CFG.needDmg)
      endChase(true, 'Der Wagen des Diebes ist fahruntüchtig — <b>festgenommen!</b>');
    else if (car.damage >= 100)
      endChase(false, 'Dein Streifenwagen ist Schrott. Die Verfolgung ist beendet.');
    else if (chaseTime <= 0)
      endChase(false, 'Die Zeit ist abgelaufen — der Dieb ist entkommen.');
  } else {
    const pct = Math.min(100, car.damage);
    document.getElementById('ch-bar').style.width = pct + '%';
    let near = Infinity, alive = 0;
    for (const a of chasers) {
      if (a.wrecked) continue;
      alive++;
      near = Math.min(near, Math.hypot(car.x - a.x, car.z - a.z));
    }
    document.getElementById('ch-l1').textContent =
      `🕶 Durchhalten — dein Schaden ${Math.round(pct)} %`;
    if (_toastT > 0) _toastT -= dt;
    else document.getElementById('ch-l2').textContent =
      `⏱ ${Math.max(0, Math.ceil(chaseTime))} s · ${alive} Streifenwagen` +
      (alive ? ` · nächster ${Math.round(near)} m` : '');
    if (car.damage >= 100)
      endChase(false, 'Dein Wagen wurde in die Kulisse gerammt und ist Schrott.');
    else if (alive === 0)
      endChase(true, 'Alle Streifenwagen ausgefallen — <b>du bist frei!</b>');
    else if (chaseTime <= 0)
      endChase(true, 'Du hast die Polizei abgeschüttelt — <b>entkommen!</b>');
  }
}

// ══════════════════════════════════════════════════════════════════════════
//  Spielerauto
// ══════════════════════════════════════════════════════════════════════════
const MAX_SPD = 52.8, MAX_REV = 6, ACCEL = 7.2, BRAKE = 16, DRAG = 1.6;
const STEER_SPD = 2.4, GRIP = 6.0, GRIP_HANDBRAKE = 1.5;

// Cockpit (an der Kamera befestigt → bewegt sich automatisch mit)
const wheelPivot = new THREE.Group();
(function buildCockpit() {
  const dash = new THREE.Mesh(
    new THREE.BoxGeometry(2.3, 0.34, 0.6),
    new THREE.MeshLambertMaterial({ color: 0x191b1e })
  );
  dash.position.set(0, -0.74, -0.62);
  cam.add(dash);

  const hood = new THREE.Mesh(
    new THREE.BoxGeometry(1.98, 0.08, 2.3),
    new THREE.MeshLambertMaterial({ color: 0xb43030 })
  );
  hood.position.set(0, -0.86, -2.1);
  cam.add(hood);

  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(0.2, 0.028, 8, 22),
    new THREE.MeshLambertMaterial({ color: 0x101215 })
  );
  wheelPivot.add(rim);
  const spoke = new THREE.Mesh(
    new THREE.BoxGeometry(0.36, 0.022, 0.022),
    new THREE.MeshLambertMaterial({ color: 0x101215 })
  );
  wheelPivot.add(spoke);
  wheelPivot.position.set(0, -0.6, -0.56);
  wheelPivot.rotation.x = -0.42;
  cam.add(wheelPivot);
})();

// ── Eingabe: WASD ───────────────────────────────────────────────────────────
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR') resetCar();
  if (['KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });

const touch = { left: false, right: false, gas: false, brake: false };
[['t-l','left'], ['t-r','right'], ['t-g','gas'], ['t-b','brake']].forEach(([id, prop]) => {
  const el = document.getElementById(id);
  const on  = e => { touch[prop] = true;  el.classList.add('on');    e.preventDefault(); };
  const off = e => { touch[prop] = false; el.classList.remove('on'); e.preventDefault(); };
  el.addEventListener('touchstart',  on,  { passive: false });
  el.addEventListener('touchend',    off, { passive: false });
  el.addEventListener('touchcancel', off, { passive: false });
  el.addEventListener('mousedown',   on);
  el.addEventListener('mouseup',     off);
});

function resetCar() {
  car.x = START_X; car.z = START_Z;
  car.heading = 0; car.speed = 0; car.steer = 0; car.vx = 0; car.vz = 0;
  if (MODE !== 'chase') car.damage = 0;   // in der Jagd bleibt der Schaden bestehen
}

function updateCar(dt) {
  const gas    = keys.KeyW || touch.gas;
  const brake  = keys.KeyS || touch.brake;
  const left   = keys.KeyA || touch.left;
  const right  = keys.KeyD || touch.right;
  const handbr = keys.Space;

  // Längsdynamik
  if (gas) {
    car.speed += ACCEL * (1 - Math.abs(car.speed) / MAX_SPD * 0.72) * dt;
  } else if (brake) {
    if (car.speed > 0.2)      car.speed -= BRAKE * dt;
    else                      car.speed = Math.max(-MAX_REV, car.speed - ACCEL * 0.6 * dt);
  } else {
    car.speed -= Math.sign(car.speed) * Math.min(Math.abs(car.speed), DRAG * dt);
  }
  if (handbr) car.speed -= Math.sign(car.speed) * Math.min(Math.abs(car.speed), BRAKE * 0.8 * dt);
  car.speed = Math.max(-MAX_REV, Math.min(MAX_SPD, car.speed));

  // Lenkung
  const steerIn = (left ? -1 : 0) + (right ? 1 : 0);
  const absSp   = Math.abs(car.speed);
  const sFactor = absSp < 0.5 ? 0 : (1 - 0.42 * absSp / MAX_SPD);
  const rev     = car.speed < -0.1 ? -1 : 1;
  car.steer += (steerIn - car.steer) * 6 * dt;
  // Bildschirm-rechts entspricht Welt −X, daher verringert Rechtslenken den Winkel
  car.heading -= car.steer * STEER_SPD * sFactor * rev * dt;

  // Längs-/Querzerlegung → Grip-Modell
  const fx = Math.sin(car.heading), fz = Math.cos(car.heading);
  const sx = fz, sz = -fx;
  let vSide = car.vx * sx + car.vz * sz;
  const grip = handbr ? GRIP_HANDBRAKE : GRIP;
  vSide -= vSide * Math.min(1, grip * dt);
  car.vx = fx * car.speed + sx * vSide;
  car.vz = fz * car.speed + sz * vSide;

  car.x += car.vx * dt;
  car.z += car.vz * dt;

  // Lenken erzeugt etwas Querimpuls (sonst gäbe es nie Schlupf)
  const slip = car.steer * absSp * 0.04;
  car.vx += sx * slip;
  car.vz += sz * slip;

  collideWithNPCs();

  // Kulisse & Gegner nur im Jagd-Modus
  if (MODE === 'chase') {
    const imp = hitObstacles(car, 1.7);
    // Der rammende Wagen steckt Treffer besser weg als der Gerammte
    if (imp > 5) { car.damage = Math.min(100, car.damage + (imp - 5) * 1.1); _shake = Math.max(_shake, 0.2); }
    ramChasers();
  }
  wheelPivot.rotation.z = -car.steer * 0.9;
}

function collideWithNPCs() {
  const R = 3.4;
  for (const npc of npcs) {
    const dx = car.x - npc.x, dz = car.z - npc.z;
    const d = Math.hypot(dx, dz);
    if (d >= R || d < 0.001) continue;
    const nx = dx / d, nz = dz / d;
    const overlap = R - d;
    // Beide auseinanderschieben
    car.x += nx * overlap * 0.5;  car.z += nz * overlap * 0.5;
    npc.x -= nx * overlap * 0.5;  npc.z -= nz * overlap * 0.5;
    npc.speed *= 0.5;
    car.speed *= 0.72;
  }
}

// ══════════════════════════════════════════════════════════════════════════
//  Motorsound mit 6-Gang-Schaltung
// ══════════════════════════════════════════════════════════════════════════
const GEAR_TOPS = [0.13, 0.27, 0.43, 0.62, 0.82, 1.0];
let actx = null, engOsc = null, engGain = null, engFilt = null;
let curGear = 1, shiftAt = -1;

function initAudio() {
  if (actx) return;
  try { actx = new (AudioContext || webkitAudioContext)(); } catch (e) { return; }
  engOsc  = actx.createOscillator(); engOsc.type = 'sawtooth'; engOsc.frequency.value = 60;
  engFilt = actx.createBiquadFilter(); engFilt.type = 'lowpass';
  engFilt.frequency.value = 700; engFilt.Q.value = 5;
  engGain = actx.createGain(); engGain.gain.value = 0;
  engOsc.connect(engFilt); engFilt.connect(engGain); engGain.connect(actx.destination);
  engOsc.start();
}
addEventListener('keydown',   initAudio, { once: true });
addEventListener('mousedown', initAudio, { once: true });
addEventListener('touchstart',initAudio, { once: true });

function gearOf(frac) {
  for (let i = 0; i < GEAR_TOPS.length; i++) {
    if (frac <= GEAR_TOPS[i]) {
      const lo = i === 0 ? 0 : GEAR_TOPS[i - 1];
      return { gear: i + 1, rpm: (frac - lo) / (GEAR_TOPS[i] - lo) };
    }
  }
  return { gear: 6, rpm: 1 };
}

function updateEngine() {
  const frac = Math.abs(car.speed) / MAX_SPD;
  const g = gearOf(frac);
  if (g.gear !== curGear) { curGear = g.gear; shiftAt = performance.now(); }
  if (!actx || actx.state === 'suspended') return;
  const rpm  = 0.2 + g.rpm * 0.8;
  const dip  = (performance.now() - shiftAt) < 160 ? 0.42 : 1;   // Zugkraftunterbrechung
  const load = (keys.KeyW || touch.gas) ? 1 : 0.55;
  engOsc.frequency.setTargetAtTime(55 + rpm * 150, actx.currentTime, 0.05);
  engFilt.frequency.setTargetAtTime(420 + rpm * 1500, actx.currentTime, 0.06);
  engGain.gain.setTargetAtTime(0.055 * load * dip, actx.currentTime, 0.05);
}

function gearLabel() {
  if (car.speed < -0.3) return 'R';
  if (Math.abs(car.speed) < 0.4) return 'N';
  return String(curGear);
}

// ══════════════════════════════════════════════════════════════════════════
//  Hauptschleife
// ══════════════════════════════════════════════════════════════════════════
// Gegner aufstellen: als Polizei jagst du einen Dieb, als Dieb mehrere Streifenwagen
if (MODE === 'chase') {
  if (ROLE === 'police') spawnChaser('thief', 0);
  else for (let i = 0; i < CFG.cops; i++) spawnChaser('police', i);
}

const clock = new THREE.Clock();
const spdEl = document.getElementById('spd');
const gearEl = document.getElementById('gear');

function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.getElapsedTime();

  if (!chaseOver) updateCar(dt);
  updateSignals(t);
  updateNPCs(dt, t);
  if (MODE === 'chase') { updateChasers(dt); updateChase(dt); }
  updateEngine();

  cam.position.set(car.x, 1.28, car.z);
  cam.rotation.set(0, car.heading + Math.PI, car.steer * 0.022);
  if (_shake > 0.001) {          // Rütteln nach Aufprall
    cam.rotation.x += (Math.random() - 0.5) * _shake;
    cam.rotation.z += (Math.random() - 0.5) * _shake * 0.6;
    _shake *= 0.86;
  }

  spdEl.textContent  = Math.round(Math.abs(car.speed) * 3.6);
  gearEl.textContent = gearLabel();

  renderer.render(scene, cam);
}
loop();

}
</script>
